version: 2 #Version du format yaml

sources:
  - name: tlc_taxi_trips 
    meta:
      # external_location: 'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-11.parquet' # pour le mois de novembre 2024
      # Generalisation pour l'annee 2024
      # External path: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-XX.parquet, ou XX est le mois de 01 a 12
      # Local path: ./data/yellow_tripdata_2024-XX.parquet
      external_location:  
        (FROM read_parquet(
          list_transform(
            range(1, 13),
            month -> './data/yellow_tripdata_2024-' || lpad(month::text, 2, '0') || '.parquet'
          )
        ))
      formatter: oldstyle
    tables:
      - name: raw_yellow_tripdata


      